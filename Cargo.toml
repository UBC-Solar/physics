[workspace]
members = ["crates/physics", "crates/physics-py"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/UBC-Solar/physics"

[workspace.dependencies]
# `numpy` (in physics-py) re-exports ndarray and must resolve to the same version as the one used
# here, so that array views pass between the two crates without copying.
ndarray = "0.17"
